<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Monsterwelt RPG – by Franks</title>
<style>
:root{--bg:#1b2a1f;--ui:#2e4a35;--accent:#e8c15a;--txt:#f2f2e6}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
.menuCard,#subContent{touch-action:pan-y!important;-webkit-overflow-scrolling:touch}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif;color:var(--txt)}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;background:#4a7a4a}
#rotateMsg{position:fixed;inset:0;background:#000;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:5vw;z-index:999;padding:20px}
@media (orientation:portrait){#rotateMsg{display:flex}#game,#btnB,#btnStart,#btnPoints,#btnFish{display:none!important}}
#joyBase{position:fixed;left:6vw;bottom:8vh;width:26vw;max-width:140px;height:26vw;max-height:140px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3)}
#joyStick{position:absolute;left:50%;top:50%;width:45%;height:45%;border-radius:50%;background:rgba(255,255,255,.5);transform:translate(-50%,-50%)}
.abtn{position:fixed;width:15vw;max-width:70px;height:15vw;max-height:70px;border-radius:50%;background:var(--accent);color:#3a2c0c;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:5vw;border:2px solid #0006}
#btnA{right:8vw;bottom:12vh}
#btnB{right:22vw;bottom:6vh}
#hud{position:fixed;top:env(safe-area-inset-top,6px);left:6px;background:#0008;padding:6px 10px;border-radius:8px;font-size:14px;min-width:150px}
.hpbar{background:#333;height:8px;border-radius:4px;overflow:hidden;margin-top:2px}
.hpfill{background:#5ec95e;height:100%}
.expbar{background:#1a2636;height:5px;border-radius:3px;overflow:hidden;margin-top:3px}
.expfill{background:#7ec8e3;height:100%}
#btnStart{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;background:#1f2f45e6;color:#fff;border:2px solid var(--accent);border-radius:16px;padding:7px 14px;font-weight:bold;font-size:14px;letter-spacing:1px;z-index:50;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 3px 8px #0007}
#btnStart:active{filter:brightness(1.3)}
#btnA,#btnB{user-select:none;-webkit-user-select:none;touch-action:none}
#btnB{z-index:50}
/* Wenn Menü, Kampf oder Unterseite offen sind: B wandert als kleiner Zurück-Knopf nach oben rechts */
body.overlay #btnStart,body.overlay #btnPoints,body.overlay #btnFish{display:none}
#btnFish{position:fixed;top:calc(108px + env(safe-area-inset-top,0px));right:10px;width:46px;height:46px;border-radius:50%;background:#1f2f45e6;border:2px solid #7a8aa0;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:50;opacity:.5;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 3px 8px #0007;transition:opacity .3s}
#btnFish.ready{opacity:1;border-color:#7fdcff;background:radial-gradient(circle at 40% 35%,#8fd8ff,#2c7ec8 65%,#1a4a80)}
#btnFish.bite{border-color:#ffe37a;animation:fishBite .16s linear infinite}
@keyframes fishBite{0%,100%{transform:rotate(-12deg) scale(1.1)}50%{transform:rotate(12deg) scale(1.1)}}
#btnPoints{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:10px;width:46px;height:46px;border-radius:50%;background:#1f2f45e6;border:2px solid #7a8aa0;color:#c8d0dc;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:50;opacity:.55;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 3px 8px #0007;transition:opacity .3s}
#btnPoints .pbadge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:#e8452c;color:#fff;font:bold 12px/20px sans-serif;text-align:center;border:2px solid #fff;display:none}
#btnPoints.glow{opacity:1;border-color:#ffe37a;color:#fff;background:radial-gradient(circle at 40% 35%,#ffe890,#e8a020 60%,#a86a10);animation:pGlow 1.2s ease-in-out infinite}
#btnPoints.glow .pbadge{display:block}
@keyframes pGlow{0%,100%{box-shadow:0 0 6px 2px #ffd84a99,0 3px 8px #0007;transform:scale(1)}50%{box-shadow:0 0 18px 8px #ffd84acc,0 3px 8px #0007;transform:scale(1.08)}}
html body.overlay #btnB{position:fixed;left:auto;bottom:auto;top:calc(8px + env(safe-area-inset-top,0px));right:10px;width:46px;height:46px;max-width:46px;max-height:46px;font-size:18px;z-index:700;box-shadow:0 3px 10px #000a;opacity:.95}
html body.overlay #btnB::after{content:"◀";position:absolute;left:-4px;top:-6px;font-size:11px;background:#1f2f45;color:#fff;border-radius:8px;padding:1px 4px}
body.hideB #btnB{display:none}
#dialog{position:fixed;left:4%;right:4%;bottom:2vh;background:#0009;border:2px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:15px;display:none;max-height:20vh;overflow:auto}
#menu,#battle{position:fixed;inset:0;background:#000a;backdrop-filter:blur(2px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:500}
.menuCard{background:linear-gradient(180deg,#3d6146,#182a1c);border:2px solid var(--accent);border-radius:20px;padding:20px 22px;width:84vw;max-width:380px;max-height:86vh;overflow:auto;box-shadow:0 14px 36px #000a, inset 0 1px 0 #ffffff26}
body.lefty #joyBase{left:auto;right:6vw}
body.lefty #btnA{right:auto;left:8vw}
body.lefty #btnB{right:auto;left:22vw}
#title{position:fixed;inset:0;z-index:70;display:block;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:linear-gradient(180deg,#1b2a55 0%,#3a5fa0 45%,#7fc4e8 70%,#6ec766 70.2%,#3f8a42 100%);color:#fff;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#title .tStar{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tTwinkle 2.4s infinite}
@keyframes tTwinkle{0%,100%{opacity:.25}50%{opacity:1}}
#titleLogo{font-size:min(11vw,13vh);font-weight:900;letter-spacing:2px;line-height:1;color:#ffe37a;-webkit-text-stroke:2px #7a3a10;text-shadow:0 4px 0 #b3561c,0 8px 18px #000a;transform:rotate(-2deg);text-align:center}
#titleSub{font-size:min(3.6vw,3.6vh);opacity:.9;letter-spacing:3px;text-transform:uppercase;text-shadow:0 2px 4px #0008;margin-top:-.6vh}
#titleMons{display:flex;gap:1.5vw;align-items:flex-end;height:min(15vw,17vh)}
#titleMons div{height:100%;aspect-ratio:1;animation:tBob 1.6s ease-in-out infinite}
@keyframes tBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10%)}}
#titleLoad{width:min(70vw,360px);text-align:center;font-size:13px}
#titleBar{height:12px;border-radius:8px;background:#0006;border:2px solid #ffffff80;overflow:hidden;margin-top:5px}
#titleBar div{height:100%;width:0;background:linear-gradient(90deg,#ffe37a,#ff9a3a);transition:width .12s}
#titleMenu{display:none;flex-direction:column;gap:9px;width:min(78vw,340px)}
#titleMenu button{font-size:17px;padding:11px 14px;border-radius:14px;font-weight:bold}
#titleMenu button small{display:block;font-size:12px;font-weight:normal;opacity:.85;margin-top:2px}
#titleMenu button:disabled{opacity:.45}
#titleInner{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;padding:14px 0 26px;box-sizing:border-box}
#titlePanel{display:none;width:min(88vw,420px);background:linear-gradient(180deg,#3d6146,#182a1c);border:2px solid var(--accent);border-radius:18px;padding:14px 16px;box-shadow:0 12px 30px #000a}
#titlePanel h3{margin:0 0 10px;text-align:center;color:#ffe9ad}
.optRow{margin:8px 0}
.optRow .optLabel{font-size:14px;margin-bottom:5px;font-weight:bold}
.optSeg{display:flex;gap:6px}
.optSeg button{flex:1;padding:8px 4px;font-size:14px;border-radius:10px;opacity:.6}
.optSeg button.on{opacity:1;outline:2px solid #ffe37a}
@media (max-height:430px){#titleLogo{font-size:min(9vw,11vh)}#titleMons{height:min(11vw,13vh)}#titleMenu button{padding:8px 12px;font-size:15px}#titleMenu{gap:6px}#titleInner{gap:1vh}}
#titleVer{position:absolute;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:10px;font-size:11px;opacity:.7}
#intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 35%,#7fc4e8 0%,#4a8fc0 45%,#1f3f66 100%);overflow:hidden;user-select:none;-webkit-user-select:none}
#introStage{flex:1;position:relative;min-height:0}
#introStage .floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,#7ccf6a,#4a9850)}
#introStage .floor::before{content:"";position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:62vh;max-width:70%;height:34px;border-radius:50%;background:#0000002a}
#introProf{position:absolute;left:50%;bottom:6%;height:92%;aspect-ratio:3/4;transform:translateX(-62%);transition:opacity .5s,transform .5s}
#introPet{position:absolute;left:50%;bottom:7%;height:34%;aspect-ratio:1;transform:translateX(62%);transition:opacity .5s}
#introLegend{position:absolute;left:50%;bottom:8%;height:62%;aspect-ratio:1;transform:translateX(38%) scale(.6);opacity:0;transition:opacity .6s,transform .6s;pointer-events:none}
#introLegend.on{opacity:1;transform:translateX(38%) scale(1)}
#introLegend .lgGlow{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,#fff8c0 0%,#b0ffb080 40%,#80e0ff00 70%);animation:lgPulse 2.4s ease-in-out infinite}
#introLegend .lgMon{position:absolute;inset:0;animation:lgFloat 3s ease-in-out infinite;filter:drop-shadow(0 0 10px #fffbd0)}
#introLegend .lgName{position:absolute;left:50%;top:-4%;transform:translateX(-50%);white-space:nowrap;background:#1f2f45d9;color:#ffe37a;font-weight:bold;font-size:13px;padding:3px 10px;border-radius:10px;border:1px solid #ffe37a}
@keyframes lgPulse{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.06);opacity:1}}
@keyframes lgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
#introPet.hop{animation:petHop 1.2s ease-in-out infinite}
@keyframes petHop{0%,100%{transform:translateX(62%) translateY(0)}50%{transform:translateX(62%) translateY(-8%)}}
#introBox{position:relative;margin:0 3vw calc(2vh + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#fdfbf2,#efe7cf);color:#2a2418;border:3px solid #3a5a8a;border-radius:16px;padding:14px 18px 16px;min-height:78px;box-shadow:0 8px 24px #0008;font-size:17px;line-height:1.4}
#introName{position:absolute;top:-15px;left:16px;background:#3a5a8a;color:#fff;font-weight:bold;font-size:13.5px;padding:3px 12px;border-radius:10px;letter-spacing:.5px}
#introNext{position:absolute;right:14px;bottom:6px;color:#3a5a8a;font-size:15px;animation:introBlink 1s infinite}
@keyframes introBlink{0%,100%{opacity:1}50%{opacity:.2}}
#introInputRow{display:flex;gap:8px;margin-top:10px}
#introInputRow input.needName{border-color:#d8342a;background:#fff0ee;animation:nameShake .35s ease}
@keyframes nameShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#introWarn{margin-top:6px;color:#c0392b;font-size:14px;font-weight:bold}
#introGender{display:flex;gap:12px;margin-top:10px;justify-content:center}
#introGender button{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 8px;font-size:17px;font-weight:bold;background:#fff;color:#2a2418;border:3px solid #3a5a8a;border-radius:14px;box-shadow:0 3px 6px #0004}
#introGender button:active{background:#e8f0ff}
#introGender img{width:44px;height:57px;image-rendering:auto}
#introInputRow input{flex:1;min-width:0;font-size:17px;padding:9px 12px;border:2px solid #3a5a8a;border-radius:10px;background:#fff;color:#222;outline:none}
#introInputRow button{padding:9px 18px;font-size:16px;font-weight:bold;background:#3a5a8a;color:#fff;border:2px solid #2a4468;border-radius:10px}
#introSkip{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;background:#0006;color:#fff;border:1px solid #fff6;border-radius:12px;padding:5px 12px;font-size:13px;z-index:2}
.menuCard h2{margin:0 0 16px;text-align:center;font-size:23px;letter-spacing:1.5px;color:#ffe9ad;text-shadow:0 2px 3px #0007}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.menuGrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;font-size:15px}
.menuGrid button .mi{font-size:26px;line-height:1}
.menuDivider{height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:4px 0 14px;opacity:.7}
.menuFoot{display:flex;flex-direction:column;gap:9px}
#menu button{background:linear-gradient(180deg,#4f8a5c,#356b42);color:#fff;border:2px solid #ffdd88;border-radius:12px;font-size:16px;font-weight:bold;box-shadow:0 3px 6px #0006, inset 0 1px 0 #ffffff33;padding:11px 14px}
#menu button:active{filter:brightness(1.15)}
#mClose{background:linear-gradient(180deg,#c15234,#7a2c1c)!important;border-color:#ffb38a!important}
#subContent h3{margin:2px 0 12px;text-align:center;font-size:20px;color:#ffe9ad;text-shadow:0 2px 3px #0007}
#subContent h4{margin:16px 0 8px;font-size:15px;color:#ffe9ad;opacity:.9}
#subContent button{background:linear-gradient(180deg,#4f8a5c,#356b42);color:#fff;border:2px solid #ffdd88;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:bold;box-shadow:0 2px 5px #0006}
#subContent button:active{filter:brightness(1.15)}
#subContent button:disabled{opacity:.4;filter:none}
.subCard{background:linear-gradient(180deg,#2f4d38,#16241b);border:2px solid var(--accent);border-radius:16px;padding:12px 14px;margin:8px 0;display:flex;gap:12px;align-items:center;box-shadow:0 3px 8px #0006}
.subCard .miniSprite{width:52px;height:52px;flex:0 0 auto}
.subCard b{font-size:16px}
.subCard .badge{font-size:12px;color:#ffe37a;margin-top:2px}
.subGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.itemCard{background:linear-gradient(180deg,#2f4d38,#16241b);border:2px solid var(--accent);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:0 3px 8px #0006}
.itemCard .ii{font-size:30px;line-height:1}
.itemCard b{font-size:15px}
.itemCard .count{font-size:19px;font-weight:bold;color:#ffe37a}
.itemCard small{opacity:.85;font-size:11.5px;line-height:1.3}
.itemCard.empty{opacity:.55;border-style:dashed}
#battlePanel{position:fixed;inset:0;display:none;flex-direction:column;background:linear-gradient(#345,#123);z-index:400}
/* Kampf-Layout passt sich an jede Bildschirmgröße an: Kampffeld groß, Menü kompakt */
#battleScene{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.sprite::before{content:"";position:absolute;left:-18%;right:-18%;bottom:-6%;height:18%;border-radius:50%;background:#0000002e;z-index:-1}
#actMain{align-content:center}
#battleMenu{position:relative;flex:0 0 auto;height:clamp(128px,31vh,290px);background:#1a2f22;border-top:3px solid var(--accent);display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));overflow:auto}
.combatant{position:absolute;background:#000a;border-radius:10px;padding:5px 10px;font-size:clamp(11px,2.5vh,16px);width:clamp(165px,30vw,340px);box-shadow:0 3px 8px #0006;z-index:2}
.combatant .hpbar{height:clamp(7px,1.3vh,12px)}
#enemyInfo{top:calc(12% + env(safe-area-inset-top,0px));left:3%}
#playerInfo{bottom:6%;right:3%}
.sprite{position:absolute;width:min(30vh,26vw,260px);aspect-ratio:1;filter:drop-shadow(0 6px 6px #0006);transition:transform .15s}
#enemySprite{top:calc(8% + env(safe-area-inset-top,0px));right:clamp(60px,16vw,220px)}
#allySprite{bottom:3%;left:clamp(16px,10vw,160px)}
#log{z-index:3}
.sprite.hit{animation:hitflash .3s}
@keyframes hitflash{0%{filter:brightness(2.4) drop-shadow(0 6px 6px #0006)}100%{filter:brightness(1) drop-shadow(0 6px 6px #0006)}}
.sprite.atkA{animation:lungeA .38s ease}
.sprite.atkE{animation:lungeE .38s ease}
@keyframes lungeA{0%{transform:translateX(0)}45%{transform:translateX(22px) scale(1.06)}100%{transform:translateX(0)}}
@keyframes lungeE{0%{transform:translateX(0)}45%{transform:translateX(-22px) scale(1.06)}100%{transform:translateX(0)}}
.miniSprite{width:44px;height:44px;flex:0 0 auto;vertical-align:middle}
#catchCapsule{position:absolute;width:18px;height:26px;left:10%;bottom:6%;display:none;z-index:450}
#catchCapsule.throwCap{animation:throwArc .6s ease forwards}
#catchCapsule.wobbleCap{animation:capWobble .35s ease-in-out 3}
#catchCapsule.capSuccess{animation:capPop .5s ease forwards}
#catchCapsule.capFail{animation:capBreak .5s ease forwards}
.sprite.shakeCap{animation:critterShake .35s ease-in-out 3}
@keyframes critterShake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-7px) rotate(-5deg)}75%{transform:translateX(7px) rotate(5deg)}}
@keyframes throwArc{0%{left:10%;bottom:6%;transform:rotate(0)}50%{left:44%;bottom:70%;transform:rotate(360deg)}100%{left:62%;bottom:40%;transform:rotate(720deg)}}
@keyframes capWobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
@keyframes capPop{0%{transform:scale(1);filter:none}50%{transform:scale(1.35);filter:brightness(1.9) drop-shadow(0 0 10px #7CFC7C)}100%{transform:scale(0);opacity:0}}
@keyframes capBreak{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-28deg)}60%{transform:rotate(28deg) scale(1.1)}100%{transform:scale(0);opacity:0}}
#catchStars{position:fixed;width:0;height:0;z-index:460}
.starParticle{position:absolute;left:50%;top:50%;font-size:22px;color:#ffe37a;text-shadow:0 0 6px #fff8;animation:starBurst .85s ease-out forwards;pointer-events:none}
@keyframes starBurst{0%{transform:translate(-50%,-50%) rotate(var(--ang,0deg)) translateY(0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--ang,0deg)) translateY(-60px) scale(1.15);opacity:0}}
#escapePuff{position:fixed;width:0;height:0;z-index:460}
.puffParticle{position:absolute;left:50%;top:50%;font-size:20px;opacity:.9;animation:puffOut .6s ease-out forwards;pointer-events:none}
@keyframes puffOut{0%{transform:translate(-50%,-50%) rotate(var(--ang,0deg)) translateY(0) scale(.4);opacity:.9}100%{transform:translate(-50%,-50%) rotate(var(--ang,0deg)) translateY(-34px) scale(1.3);opacity:0}}
.sprite.escapeBounce{animation:escapeBounce .5s ease}
@keyframes escapeBounce{0%{transform:translate(0,0) scale(1);opacity:1}30%{transform:translate(10px,-14px) scale(1.05);opacity:1}60%{transform:translate(-8px,4px) scale(.95);opacity:.7}100%{transform:translate(0,0) scale(1);opacity:1}}
.actrow{display:flex;flex-wrap:wrap;gap:clamp(6px,1.4vh,10px);width:100%;flex:1;align-content:flex-start}
.actrow button{flex:1 1 30%;min-width:110px;background:linear-gradient(180deg,#4f8a5c,#356b42);color:#fff;border:2px solid #ffdd88;border-radius:14px;padding:clamp(4px,1.2vh,12px) 8px;font-size:clamp(14px,3.4vh,19px);font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:clamp(42px,11vh,64px);box-shadow:0 3px 6px #0006, inset 0 1px 0 #ffffff40}
.actrow button:active{filter:brightness(1.15)}
.actrow button small{font-size:clamp(10px,2.2vh,12px);font-weight:normal;opacity:.95;text-align:center;line-height:1.25;color:#f4ffe9}
#battleDialog{position:absolute;inset:8px;display:none;flex-direction:column;justify-content:space-between;background:#f7f3e3;color:#1b1b1b;border:4px solid #3a5a8c;outline:3px solid #f7f3e3;border-radius:12px;padding:14px 18px;font-size:clamp(16px,4.2vmin,22px);line-height:1.45;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 2px #9fb8e0,0 4px 10px #0007;z-index:5;user-select:none;-webkit-user-select:none}
#bdText{white-space:pre-wrap;overflow:auto}
#bdNext{align-self:flex-end;color:#c0392b;font-size:18px;animation:bdBlink .8s steps(2) infinite}
@keyframes bdBlink{50%{opacity:0}}
.stBadge{display:inline-block;margin-left:4px;padding:0 4px;border-radius:4px;color:#fff;font-size:9px;font-weight:bold;line-height:14px;vertical-align:1px;text-shadow:0 1px 0 #0006}
#fieldMove{position:fixed;inset:0;z-index:640;display:flex;align-items:center;justify-content:center;background:#0006;cursor:pointer}

<script>
// ---------- FEHLER-ANZEIGE (Debug) ----------
function showDebugError(msg){
 let box=document.getElementById("debugBox");
 if(!box){
  box=document.createElement("div");
  box.id="debugBox";
  box.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#c0203099;color:#fff;font:12px monospace;padding:8px;max-height:40vh;overflow:auto;white-space:pre-wrap;pointer-events:none";
  document.body.appendChild(box);
 }
 box.textContent+=(box.textContent?"\n---\n":"")+"FEHLER: "+msg;
}
addEventListener("error",e=>showDebugError((e.message||"unbekannt")+" @ "+(e.filename||"")+":"+(e.lineno||"")));
addEventListener("unhandledrejection",e=>showDebugError("Promise: "+(e.reason&&e.reason.message||e.reason)));

// ---------- DATEN ----------
// Typen-Kreislauf: jeder Typ ist stark gegen den nächsten und schwach gegen den vorherigen
// Wasser ➜ Feuer ➜ Natur ➜ Erde ➜ Blitz ➜ Psycho ➜ Drache ➜ Wind ➜ Wasser (Achteck)
const TYPE_CYCLE=["Wasser","Feuer","Natur","Erde","Blitz","Psycho","Drache","Wind"];
const TYPE_REASON={
 Wasser:"Wasser löscht Feuer",Feuer:"Feuer verbrennt Natur",Natur:"Wurzeln sprengen Erde",
 Erde:"Erde leitet Blitze ab",Blitz:"Stromschläge stören den Geist",Psycho:"Geisteskraft bändigt Drachen",
 Drache:"Drachen beherrschen die Lüfte",Wind:"Stürme peitschen das Wasser"
};
const TYPEFX={};
TYPE_CYCLE.forEach((t,i)=>{
 const strongVs=TYPE_CYCLE[(i+1)%TYPE_CYCLE.length],weakVs=TYPE_CYCLE[(i+TYPE_CYCLE.length-1)%TYPE_CYCLE.length];
 TYPEFX[t]={[strongVs]:2,[weakVs]:.5};
});
function eff(a,d){return (TYPEFX[a]&&TYPEFX[a][d])||1}
const NT=TYPE_CYCLE.length;
function strongAgainst(t){const i=TYPE_CYCLE.indexOf(t);return i<0?null:TYPE_CYCLE[(i+1)%NT]}
function weakAgainst(t){const i=TYPE_CYCLE.indexOf(t);return i<0?null:TYPE_CYCLE[(i+NT-1)%NT]} // Typ, der t besiegt
// Gegenüberliegendes Element im Achteck (genau gegenüber, spiegelt sich durch die Mitte)
function oppositeType(t){const i=TYPE_CYCLE.indexOf(t);return i<0?null:TYPE_CYCLE[(i+NT/2)%NT]}
function effLabel(f){
 if(f>1)return {txt:"▲ Sehr effektiv",col:"#7dff8a"};
 if(f<1)return {txt:"▼ Wenig effektiv",col:"#ff8a7a"};
 return {txt:"● Normal",col:"#f4ffe9"};
}
const MOVES={
 stoss:{name:"Stoß",type:"Normal",pow:35,acc:.95,desc:"Einfacher Körperangriff"},
 flammenstoss:{name:"Flammenstoß",type:"Feuer",pow:45,acc:.9,effect:{status:"brand",chance:0.1},desc:"Feuerattacke, versengt den Gegner"},
 wasserstrahl:{name:"Wasserstrahl",type:"Wasser",pow:45,acc:.9,desc:"Starker Wasserstrahl"},
 blattklinge:{name:"Blattklinge",type:"Natur",pow:45,acc:.9,desc:"Scharfe Blätter als Klingen"},
 windschnitt:{name:"Windschnitt",type:"Wind",pow:40,acc:.9,desc:"Schneidende Windböe"},
 erdstoss:{name:"Erdstoß",type:"Erde",pow:40,acc:.9,desc:"Erschüttert den Boden"},
 feuersturm:{name:"Feuersturm",type:"Feuer",pow:65,acc:.85,desc:"Mächtiger Flammenwirbel"},
 flutwelle:{name:"Flutwelle",type:"Wasser",pow:65,acc:.85,desc:"Reißende Wassermassen"},
 dornwirbel:{name:"Dornwirbel",type:"Natur",pow:65,acc:.85,desc:"Wirbel aus Dornranken"},
 sturmboe:{name:"Sturmböe",type:"Wind",pow:65,acc:.85,desc:"Heftiger Sturmangriff"},
 steinlawine:{name:"Steinlawine",type:"Erde",pow:65,acc:.85,desc:"Herabstürzende Felsbrocken"},
 // Feuer
 feuerbiss:{name:"Feuerbiss",type:"Feuer",pow:50,acc:.9,effect:{status:"brand",chance:0.2},desc:"Biss mit lodernden Zähnen"},
 aschewolke:{name:"Aschewolke",type:"Feuer",pow:55,acc:.85,effect:{status:"brand",chance:0.3},desc:"Verbrennende Ascheschwaden"},
 magmastoss:{name:"Magmastoß",type:"Feuer",pow:70,acc:.85,effect:{status:"brand",chance:0.2},desc:"Schleudert glühende Lava"},
 infernorage:{name:"Infernorage",type:"Feuer",pow:80,acc:.8,effect:{status:"brand",chance:0.15},desc:"Entfesselte Feuerwalze"},
 vulkanausbruch:{name:"Vulkanausbruch",type:"Feuer",pow:90,acc:.8,desc:"Explosiver Feuerausbruch"},
 phoenixflamme:{name:"Phönixflamme",type:"Feuer",pow:95,acc:.78,desc:"Legendäre, wiederauflodernde Flamme"},

SPECIES.babydrache={name:"Babydrache",type:"Drache",rarity:3,special:true,slowExp:true,evoLevel:15,base:{hp:54,atk:21,def:19,spd:17,spec:18},moves:["stoss","drachenklaue"]};
SPECIES.babyengel={name:"Babyengel",type:"Psycho",rarity:3,special:true,slowExp:true,evoLevel:15,base:{hp:52,atk:17,def:18,spd:19,spec:22},moves:["stoss","gedankenstoss"]};
["babydrache","babyengel"].forEach(bid=>{
 const B=SPECIES[bid];B.evoChoice={};
 TYPE_CYCLE.forEach(el=>{
  const sid=bid.replace("baby","")+"_"+el.toLowerCase();
  const b={};Object.keys(B.base).forEach(k=>b[k]=Math.round(B.base[k]*1.32)+((ELEM_BIAS[el][k])||0));
  SPECIES[sid]={name:EGG_ELEM_NAMES[bid][el],type:el,rarity:3,special:true,slowExp:true,base:b,moves:B.moves.slice(),evolvedFrom:bid};

 });
});
// Entwicklungsstufe jeder Art (1 = Grundform … 4 = vierte Entwicklung)
Object.keys(SPECIES).forEach(sid=>{let st=1,cur=SPECIES[sid];while(cur.evolvedFrom){st++;cur=SPECIES[cur.evolvedFrom]}SPECIES[sid].stage=st});
function evoLevelOf(sid){return SPECIES[sid].evoLevel||EVO_LEVEL}
// Monster ohne Entwicklung (nicht legendär): etwas schwächer, dafür häufiger in freier Wildbahn
const SIMPLE_STAT_FACTOR=0.8;
Object.keys(SPECIES).forEach(sid=>{
 const sp=SPECIES[sid];
 if(sp.evo||sp.evolvedFrom||sp.legendary||sp.special)return;
 sp.simple=true;
 Object.keys(sp.base).forEach(k=>sp.base[k]=Math.round(sp.base[k]*SIMPLE_STAT_FACTOR));
});
// Wie oft eine Art im Gras auftaucht (relativ): einfache Arten doppelt so oft, seltene Arten (Seltenheit 3) halb so oft
function encounterWeight(sid){const sp=SPECIES[sid];return (sp.simple?2:1)*(sp.rarity>=3?0.5:1)}
function pickFromPool(pool){
 // Ausrüstung „Chance auf seltene Monster“: seltene Arten werden häufiger
 let rb=0;try{rb=gearTotal("rare")}catch(e){}
 const w=sid=>encounterWeight(sid)*(1+rb*3*Math.max(0,(SPECIES[sid].rarity||1)-1));
 const total=pool.reduce((a,sid)=>a+w(sid),0);
 let r=Math.random()*total;
 for(const sid of pool){r-=w(sid);if(r<0)return sid}
 return pool[pool.length-1];
}
// Reihenfolge für den Dex: jede Grundform direkt gefolgt von ihrer Entwicklung
const DEX_ORDER=[];
Object.keys(SPECIES).forEach(sid=>{if(SPECIES[sid].evolvedFrom)return;let cur=sid;while(cur){DEX_ORDER.push(cur);cur=SPECIES[cur].evo}if(SPECIES[sid].evoChoice)Object.values(SPECIES[sid].evoChoice).forEach(x=>DEX_ORDER.push(x))});

const STATUS_LEARN={

};

Object.keys(SPECIES).forEach(sid=>{
 const own=TYPE_MOVE_PROGRESSION[SPECIES[sid].type],counter=TYPE_MOVE_PROGRESSION[oppositeType(SPECIES[sid].type)];
 const table={};
 Object.keys(own).forEach(l=>{(table[l]=table[l]||[]).push(own[l])});
 Object.keys(COUNTER_LEARN_LEVELS).forEach(l=>{(table[l]=table[l]||[]).push(counter[COUNTER_LEARN_LEVELS[l]])});

 Object.keys(st).forEach(l=>{(table[l]=table[l]||[]).push(st[l])});

function svEye(x,y,r,iris,ol,side,fierce,slit){
 const w=r*1.2,h=r*0.74,id="ey"+(++svEyeUid);
 const ix=x-side*w,iy=y+h*0.3,ox=x+side*w,oy=y-h*0.35;
 const top=`M${ix},${iy} Q${x-side*w*0.15},${y-h*1.5} ${ox},${oy}`;
 const path=`${top} Q${x+side*w*0.25},${y+h*1.3} ${ix},${iy} Z`;
 const cx=x-side*r*0.1,cy=y+h*0.08;
 let s=`<clipPath id="${id}"><path d="${path}"/></clipPath><path d="${path}" fill="#f1ecdf"/>`;
 s+=`<g clip-path="url(#${id})"><circle cx="${cx}" cy="${cy}" r="${r*0.74}" fill="${iris}" stroke="${shade(iris,-70)}" stroke-width="${r*0.16}"/>`;
 s+=slit?`<ellipse cx="${cx}" cy="${cy}" rx="${r*0.13}" ry="${r*0.62}" fill="#0c0c0c"/>`:`<circle cx="${cx}" cy="${cy}" r="${r*0.3}" fill="#0c0c0c"/>`;
 s+=`<path d="${top} L${ox},${oy-r} L${ix},${iy-r} Z" fill="#00000040" transform="translate(0 ${h*0.45})"/>`;
 s+=`<circle cx="${cx-r*0.28}" cy="${cy-r*0.3}" r="${r*0.15}" fill="#fff" opacity=".9"/></g>`;
 s+=`<path d="${path}" fill="none" stroke="${ol}" stroke-width="1"/>`;

 return s;
}

// ---------- PIXEL-SPRITES (Handheld-Stil) ----------
// Jede Vektorgrafik wird beim Laden auf ein kleines Raster verkleinert, die Farben in Stufen
// zusammengefasst und mit einer dunklen, farbigen Pixelkontur versehen.
const PIX_SIZE=56,PIX_CACHE={};
function pixelModeOn(){return typeof OPTS==="undefined"||OPTS.gfx!=="vector"}
function creatureSVG(sid){
 if(pixelModeOn()&&PIX_CACHE[sid])return `<img src="${PIX_CACHE[sid]}" alt="" draggable="false" style="width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges">`;
 return creatureVector(sid);
}
function pixelizeImage(img,N){
 const c=document.createElement("canvas");c.width=c.height=N;
 const x=c.getContext("2d");x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";
 x.drawImage(img,0,0,N,N);
 let d;try{d=x.getImageData(0,0,N,N)}catch(e){return null}
 const a=d.data,solid=new Uint8Array(N*N);
 const q=v=>Math.max(0,Math.min(255,Math.round(v/36)*36+(v>200?20:0)));
 for(let i=0;i<N*N;i++){
  const k=i*4;
  if(a[k+3]<110){a[k+3]=0;continue}
  solid[i]=1;
  // leicht kräftigere Farben, dann in Stufen zusammenfassen (wie bei begrenzten Paletten)
  const avg=(a[k]+a[k+1]+a[k+2])/3;
  for(let j=0;j<3;j++)a[k+j]=q(avg+(a[k+j]-avg)*1.15);
  a[k+3]=255;
 }
 // Randpixel dunkel einfärben -> typische farbige Sprite-Kontur
 for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){
  const i=y*N+xx;if(!solid[i])continue;
  const edge=xx===0||y===0||xx===N-1||y===N-1||!solid[i-1]||!solid[i+1]||!solid[i-N]||!solid[i+N];
  if(edge){const k=i*4;a[k]=Math.round(a[k]*0.32);a[k+1]=Math.round(a[k+1]*0.32);a[k+2]=Math.round(a[k+2]*0.36)}
 }
 x.putImageData(d,0,0);
 try{return c.toDataURL("image/png")}catch(e){return null}
}
function prepareSprites(onProgress){
 const ids=Object.keys(SPECIES);let done=0;
 return Promise.all(ids.map(sid=>new Promise(res=>{
  const im=new Image();
  const fin=()=>{done++;if(onProgress)onProgress(done/ids.length);res()};
  im.onload=()=>{try{const u=pixelizeImage(im,PIX_SIZE);if(u)PIX_CACHE[sid]=u}catch(e){}fin()};
  im.onerror=fin;
  im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(creatureVector(sid));
 })));
}
function makeCreature(sid,lvl){
 const l=lvl||5;
 // Wilde/gegnerische Monster ab Level 15 erscheinen bereits entwickelt
 while(SPECIES[sid].evo&&l>=evoLevelOf(sid))sid=SPECIES[sid].evo;
 const s=SPECIES[sid],b=s.base;
 // Bis zu diesem Level erlernte Attacken; aktiv sind die 4 stärksten (mind. eine vom eigenen Typ)
 const learned=s.moves.slice(),tbl=(typeof LEARN!=="undefined"&&LEARN[sid])||{};
 Object.keys(tbl).forEach(lv=>{if(+lv<=l)tbl[lv].forEach(mk=>{if(!learned.includes(mk))learned.push(mk)})});
 let moves=s.moves.slice();
 if(learned.length>moves.length){
  const val=mk=>{const mv=MOVES[mk];return mv.pow>0?mv.pow+(mv.effect?mv.effect.chance*20:0):58};
  const sorted=learned.slice().sort((a,c)=>val(c)-val(a));
  moves=[];let statusOnly=0;
  for(const mk of sorted){if(moves.length>=4)break;if(MOVES[mk].pow===0){if(statusOnly>=1)continue;statusOnly++}moves.push(mk)}
  if(!moves.some(mk=>MOVES[mk].type===s.type)){const own=learned.filter(mk=>MOVES[mk].type===s.type).sort((a,c)=>MOVES[c].pow-MOVES[a].pow)[0];if(own)moves[3]=own}
 }
 return {sid,name:s.name,type:s.type,rarity:s.rarity,level:l,
  maxhp:Math.floor(b.hp+l*3),hp:Math.floor(b.hp+l*3),
  atk:Math.floor(b.atk+l*1.2),def:Math.floor(b.def+l*1.1),spd:Math.floor(b.spd+l),spec:Math.floor(b.spec+l),
  moves,learned,exp:0,expNeed:l*20*(s.slowExp?2:1),points:0};
}
const STAT_POINT_GAIN={hp:6,atk:2,def:2,spd:1,spec:1};
const STAT_LABELS={hp:"KP",atk:"Angriff",def:"Verteidigung",spd:"Tempo",spec:"Spezial"};
// Entwicklung: Art wechselt, Werte steigen um die Differenz der Grundwerte, Level/EP/Attacken bleiben
function evolveCreature(c,target){
 const from=SPECIES[c.sid],toSid=target||(from&&from.evo),to=toSid&&SPECIES[toSid];
 if(!to)return null;
 const fb=from.base,tb=to.base,oldName=c.name;
 const dhp=tb.hp-fb.hp;c.maxhp+=dhp;c.hp=Math.min(c.maxhp,c.hp+Math.max(0,dhp));
 c.atk+=tb.atk-fb.atk;c.def+=tb.def-fb.def;c.spd+=tb.spd-fb.spd;c.spec+=tb.spec-fb.spec;
 c.sid=toSid;c.name=to.name;c.type=to.type;c.rarity=to.rarity;
 return {from:oldName,to:to.name};
}
function ensureCreatureFields(c){
 if(c.points===undefined)c.points=0;
 if(SPECIES[c.sid]){c.type=SPECIES[c.sid].type;c.name=SPECIES[c.sid].name} // Typ/Name immer aus den Artdaten übernehmen
 while(SPECIES[c.sid].evo&&c.level>=evoLevelOf(c.sid))evolveCreature(c); // ältere Spielstände: fällige Entwicklungen nachholen
 // Monster ohne Entwicklung: Extrapunkte ab Level 20 nachträglich gutschreiben
 const due=simpleBonusDue(c);
 if(due>(c.simpleBonus||0)){c.points=(c.points||0)+due-(c.simpleBonus||0);c.simpleBonus=due}
 if(!c.learned)c.learned=c.moves.slice();
 if(c.moves.length>4)c.moves=c.moves.slice(0,4);
 const activeBefore=c.moves.length;
 // Bereits erreichte Lern-Level nachtragen (z. B. neue Gegentyp-Attacken für ältere Spielstände)
 const tbl=LEARN[c.sid]||{};
 // Nur Attacken behalten, die dieses Monster laut Lernliste wirklich lernen kann (räumt ältere Zuordnungen auf)
 const allowed=new Set(SPECIES[c.sid].moves);
 Object.keys(tbl).forEach(l=>tbl[l].forEach(mk=>allowed.add(mk)));
 c.learned=c.learned.filter(mk=>allowed.has(mk));
 c.moves=c.moves.filter(mk=>allowed.has(mk));
 if(!c.moves.length)c.moves=SPECIES[c.sid].moves.slice();
 SPECIES[c.sid].moves.forEach(mk=>{if(!c.learned.includes(mk))c.learned.push(mk)});
 Object.keys(tbl).forEach(l=>{if(+l<=c.level)tbl[l].forEach(mk=>{if(!c.learned.includes(mk))c.learned.push(mk)})});
 // Wurden aktive Attacken entfernt, die Lücken mit den stärksten bekannten Attacken auffüllen
 const want=Math.min(4,Math.max(activeBefore,c.moves.length));
 if(c.moves.length<want){
  c.learned.filter(mk=>!c.moves.includes(mk)).sort((a,b)=>MOVES[b].pow-MOVES[a].pow)
   .slice(0,want-c.moves.length).forEach(mk=>c.moves.push(mk));
 }
 return c;

function sfxForText(tx){

 else if(/wurde besiegt!|kann nicht mehr kämpfen/.test(tx))sfx("faint");

 else if(/daneben/.test(tx))sfx("miss");
}

const ISO_W=44,ISO_H=44,WALL_H=15;
function isoPos(x,y){return{sx:x*ISO_W,sy:y*ISO_H}}
function shade(hex,amt){
 const n=parseInt(hex.slice(1),16);
 let r=Math.min(255,Math.max(0,(n>>16)+amt)),g=Math.min(255,Math.max(0,((n>>8)&255)+amt)),b=Math.min(255,Math.max(0,(n&255)+amt));
 return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function isoDiamondPath(dx,dy){
 ctx.beginPath();
 ctx.rect(dx-ISO_W/2,dy-ISO_H/2,ISO_W,ISO_H);
}
function tileRand(x,y,salt){
 let h=(x*374761393+y*668265263+(salt||0)*2246822519)>>>0;
 h=Math.imul(h^(h>>>13),1274126177)>>>0;
 h=(h^(h>>>16))>>>0;
 return h/4294967295;
}
function drawIsoTile(dx,dy,color){
 ctx.fillStyle=color;isoDiamondPath(dx,dy);ctx.fill();
}
function drawGroundTile(dx,dy,x,y,base){
 const alt=(x+y)%2===0;
 drawIsoTile(dx,dy,alt?base:shade(base,-8));
 ctx.save();isoDiamondPath(dx,dy);ctx.clip();
 for(let i=0;i<3;i++){
  const rx=dx+(tileRand(x,y,i*2+31)-0.5)*ISO_W*0.75;
  const ry=dy+(tileRand(x,y,i*2+32)-0.5)*ISO_H*0.75;
  ctx.fillStyle=i%2===0?"rgba(0,0,0,0.07)":"rgba(255,255,255,0.09)";
  ctx.beginPath();ctx.arc(rx,ry,1.6,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function drawTreeTile(dx,dy,x,y){
 drawGroundTile(dx,dy,x,y,"#4a9850");
 ctx.fillStyle="rgba(0,0,0,0.25)";
 ctx.beginPath();ctx.ellipse(dx,dy+ISO_H*0.2,ISO_W*0.34,ISO_H*0.16,0,0,Math.PI*2);ctx.fill();
 const cyTop=dy-6;
 const blobs=[[0,-7,15],[-11,1,12],[11,1,12],[-6,10,11],[6,10,11],[0,4,13]];
 ctx.fillStyle="#2f7a3a";
 blobs.forEach(([ox,oy,r])=>{ctx.beginPath();ctx.arc(dx+ox,cyTop+oy,r,0,Math.PI*2);ctx.fill();});
 ctx.strokeStyle="#1d4a24";ctx.lineWidth=1.3;
 blobs.forEach(([ox,oy,r])=>{ctx.beginPath();ctx.arc(dx+ox,cyTop+oy,r,0,Math.PI*2);ctx.stroke();});
 ctx.fillStyle="#4fa858";
 ctx.beginPath();ctx.arc(dx-5,cyTop-5,8,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.arc(dx+5,cyTop+1,6,0,Math.PI*2);ctx.fill();
}
function drawIsoBlock(dx,dy,color,groundColor,wallH){
 wallH=wallH||WALL_H;
 drawIsoTile(dx,dy,groundColor||"#25401f");

 // Vorderseite (Wand) direkt unter der angehobenen Deckfläche
 ctx.fillStyle=shade(color,-45);
 ctx.fillRect(dx-ISO_W/2,dy+ISO_H/2-wallH,ISO_W,wallH);

 ctx.fillRect(dx-ISO_W/2,dy+ISO_H/2-wallH,ISO_W*0.16,wallH);

function drawMountainTexture(dx,dy,x,y,wallH){
 ctx.save();ctx.translate(0,-wallH);
 isoDiamondPath(dx,dy);ctx.clip();
 for(let i=0;i<5;i++){
  const rx=(tileRand(x,y,i*3+1)-0.5)*ISO_W*0.7;
  const ry=(tileRand(x,y,i*3+2)-0.5)*ISO_H*0.7;
  const r=1.2+tileRand(x,y,i*3+3)*1.8;
  ctx.fillStyle=i%2===0?"rgba(0,0,0,0.2)":"rgba(255,255,255,0.18)";
  ctx.beginPath();ctx.ellipse(dx+rx,dy+ry,r,r*0.6,0,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
 // Schneekappe angedeutet, wenn Gipfel hoch genug
 if(wallH>WALL_H*1.1){
  ctx.save();ctx.translate(0,-wallH);isoDiamondPath(dx,dy);ctx.clip();
  ctx.fillStyle="rgba(255,255,255,0.55)";
  ctx.beginPath();ctx.ellipse(dx,dy-4,ISO_W*0.22,ISO_H*0.22,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
 }
 ctx.restore();
}
function drawWaterTile(dx,dy,x,y,time){
 drawIsoTile(dx,dy,COLORS["~"]);
 ctx.save();
 isoDiamondPath(dx,dy);ctx.clip();
 const seed=tileRand(x,y,1);
 ctx.strokeStyle="rgba(255,255,255,0.4)";ctx.lineWidth=1.4;
 for(let i=0;i<2;i++){
  const phase=time*1.6+seed*10+i*2.4;
  const yOff=dy-6+i*9+Math.sin(phase)*2;
  ctx.beginPath();
  ctx.moveTo(dx-ISO_W*0.35,yOff);
  ctx.quadraticCurveTo(dx,yOff-3+Math.sin(phase+1)*2,dx+ISO_W*0.35,yOff);
  ctx.stroke();
 }
 const glintA=0.12+0.18*Math.max(0,Math.sin(time*2+seed*20));
 ctx.fillStyle=`rgba(255,255,255,${glintA})`;
 ctx.beginPath();ctx.ellipse(dx+(seed-0.5)*ISO_W*0.4,dy+(tileRand(x,y,2)-0.5)*ISO_H*0.4,5,2.4,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawGrassPatch(dx,dy,x,y){
 drawGroundTile(dx,dy,x,y,"#3f8a42");
 ctx.save();
 isoDiamondPath(dx,dy);ctx.clip();
 ctx.fillStyle="#316b34";
 for(let i=0;i<4;i++){
  const bx=dx+(tileRand(x,y,i*3+1)-0.5)*ISO_W*0.65;
  const by=dy+(tileRand(x,y,i*3+2)-0.5)*ISO_H*0.65;
  const r=5+tileRand(x,y,i*3+3)*3;
  ctx.beginPath();ctx.ellipse(bx,by,r,r*0.62,0,0,Math.PI*2);ctx.fill();
 }
 ctx.strokeStyle="#2f6b34";ctx.lineWidth=1.8;ctx.lineCap="round";
 for(let i=0;i<9;i++){
  const bx=dx+(tileRand(x,y,i*2+20)-0.5)*ISO_W*0.8;
  const by=dy+(tileRand(x,y,i*2+21)-0.5)*ISO_H*0.7;
  const h=4+tileRand(x,y,i*2+22)*4;
  const lean=(tileRand(x,y,i*2+23)-0.5)*3;
  ctx.beginPath();
  ctx.moveTo(bx,by+h*0.3);
  ctx.quadraticCurveTo(bx+lean*0.5,by-h*0.5,bx+lean,by-h);
  ctx.stroke();
 }
 ctx.restore();
}
function drawIsoProp(dx,dy,color,h){

function tileBox(dx,dy){return {l:dx-ISO_W/2,t:dy-ISO_H/2}}
function drawPaving(dx,dy,x,y){
 const {l,t}=tileBox(dx,dy);
 ctx.fillStyle="#d9c9a0";ctx.fillRect(l,t,ISO_W,ISO_H);
 // Pflastersteine in versetzten Reihen
 const rows=3,sh=ISO_H/rows;
 for(let r=0;r<rows;r++){
  const off=((r+y)%2)*7;
  for(let cx=-14+off;cx<ISO_W;cx+=15){
   const sx=l+cx,sy=t+r*sh;
   const tone=tileRand(x*7+cx,y*5+r,3);
   ctx.fillStyle=tone<0.33?"#cdbb90":tone<0.66?"#d5c49a":"#e0d2ad";
   ctx.fillRect(Math.max(l,sx+1),sy+1,Math.min(13,l+ISO_W-sx-1),sh-2);
  }
 }
 ctx.fillStyle="rgba(120,95,50,0.18)";
 for(let r=1;r<rows;r++)ctx.fillRect(l,t+r*sh-0.5,ISO_W,1);
}

function drawBuilding(b,camX,camY){

 const roofH=Math.round(H*0.56),wallTop=oy+roofH-4,wallH=oy+H-wallTop-3;
 // Bodenschatten

 // Fenster links/rechts der Tür
 const doorCx=isoPos(b.door.x,0).sx-camX;
 [ox+W*0.2,ox+W*0.8].forEach(wx=>{
  if(Math.abs(wx-doorCx)<16)return;
  ctx.fillStyle="#5d4630";ctx.fillRect(wx-8,wallTop+7,16,13);
  ctx.fillStyle="#9fd3e8";ctx.fillRect(wx-6,wallTop+9,12,9);

  ctx.fillStyle="#5d4630";ctx.fillRect(wx-0.5,wallTop+9,1,9);
 });
 // Tür
 const dw=b.glassDoor?20:14,dh=b.glassDoor?20:19,dxl=doorCx-dw/2,dyt=oy+H-4-dh;
 ctx.fillStyle="#4a3420";ctx.fillRect(dxl-2,dyt-2,dw+4,dh+2);
 if(b.glassDoor){
  ctx.fillStyle="#bfe4f2";ctx.fillRect(dxl,dyt,dw,dh);
  ctx.fillStyle="#7fb3c8";ctx.fillRect(doorCx-0.5,dyt,1,dh);
  ctx.fillStyle="rgba(255,255,255,0.6)";ctx.fillRect(dxl+2,dyt+2,3,dh-6);
 }else{
  ctx.fillStyle="#7a4b2a";ctx.fillRect(dxl,dyt,dw,dh);
  ctx.fillStyle="#5e381e";ctx.fillRect(dxl+2,dyt+3,dw-4,5);ctx.fillRect(dxl+2,dyt+10,dw-4,5);
  ctx.fillStyle="#f3c93b";ctx.beginPath();ctx.arc(dxl+dw-4,dyt+dh/2+1,1.4,0,Math.PI*2);ctx.fill();
 }
 // Dach (leicht überstehend)
 const rl=ox,rt=oy-4,rw=W,rh=roofH+2;
 ctx.fillStyle=shade(b.roof,-40);ctx.fillRect(rl,rt+rh-6,rw,6);           // Traufkante
 ctx.fillStyle=b.roof;ctx.fillRect(rl,rt,rw,rh-6);
 ctx.fillStyle=shade(b.roof,22);ctx.fillRect(rl,rt,rw,Math.round((rh-6)*0.42)); // obere, sonnige Dachfläche
 ctx.fillStyle=shade(b.roof,-18);ctx.fillRect(rl,rt+Math.round((rh-6)*0.42),rw,2); // First
 ctx.strokeStyle=shade(b.roof,-30);ctx.lineWidth=1;
 for(let yy=rt+6;yy<rt+rh-7;yy+=6){
  ctx.beginPath();ctx.moveTo(rl,yy+0.5);ctx.lineTo(rl+rw,yy+0.5);ctx.stroke();
  const off=((yy-rt)/6)%2?5:0;

let joyVec={x:0,y:0},joyActive=false,joyTouchId=null;
const joyBase=document.getElementById("joyBase"),joyStick=document.getElementById("joyStick");
function joyRect(){return joyBase.getBoundingClientRect()}
function handleJoyMove(cx,cy){
 const r=joyRect(),cx0=r.left+r.width/2,cy0=r.top+r.height/2;
 let dx=cx-cx0,dy=cy-cy0;const max=r.width/2;
 const d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}
 joyStick.style.transform=`translate(${dx-r.width*0.225}px,${dy-r.height*0.225}px)`;
 joyVec.x=dx/max;joyVec.y=dy/max;
}
function resetJoy(){joyVec={x:0,y:0};joyActive=false;joyTouchId=null;joyStick.style.transform="translate(-50%,-50%)"}
// Pointer Events: funktioniert einheitlich für Touch, Maus und Stift
if(window.PointerEvent){
 joyBase.addEventListener("pointerdown",e=>{e.preventDefault();joyActive=true;joyTouchId=e.pointerId;
  if(joyBase.setPointerCapture)joyBase.setPointerCapture(e.pointerId);handleJoyMove(e.clientX,e.clientY)});
 joyBase.addEventListener("pointermove",e=>{if(joyActive&&e.pointerId===joyTouchId)handleJoyMove(e.clientX,e.clientY)});
 joyBase.addEventListener("pointerup",e=>{if(e.pointerId===joyTouchId)resetJoy()});
 joyBase.addEventListener("pointercancel",e=>{if(e.pointerId===joyTouchId)resetJoy()});
}else{
 joyBase.addEventListener("touchstart",e=>{e.preventDefault();const t=e.changedTouches[0];joyActive=true;joyTouchId=t.identifier;handleJoyMove(t.clientX,t.clientY)});
 addEventListener("touchmove",e=>{for(const t of e.changedTouches){if(t.identifier===joyTouchId)handleJoyMove(t.clientX,t.clientY)}},{passive:false});
 addEventListener("touchend",e=>{for(const t of e.changedTouches){if(t.identifier===joyTouchId)resetJoy()}});
 joyBase.addEventListener("mousedown",e=>{e.preventDefault();joyActive=true;handleJoyMove(e.clientX,e.clientY)});
 addEventListener("mousemove",e=>{if(joyActive)handleJoyMove(e.clientX,e.clientY)});
 addEventListener("mouseup",()=>{if(joyActive)resetJoy()});
}

let moveTimer=0,stepAcc=0,walkPhase=0,isWalking=false;
// Für flüssiges Gleiten der Kamera/des Spielers zwischen zwei Kacheln (statt hartem Sprung)
let animFromX=state.px,animFromY=state.py,animT=1;
let saveDirty=false,saveTimer=0;
function renderPos(){
 // Lineare Interpolation: gleichmäßige Geschwindigkeit beim Dauerlaufen (kein Abbremsen pro Kachel)
 // Bei Teleport (z. B. Heilung nach Niederlage, Spielstand laden) sofort springen statt quer über die Karte zu gleiten
 if(Math.abs(state.px-animFromX)>1.6||Math.abs(state.py-animFromY)>1.6){animFromX=state.px;animFromY=state.py;animT=1}
 const t=Math.min(1,animT);
 return {x:animFromX+(state.px-animFromX)*t,y:animFromY+(state.py-animFromY)*t};
}
function tryMove(dt){
 if(state.inBattle||menu.style.display==="flex"||document.getElementById("subpanel").style.display==="flex"||fieldMoveOpen()||cutscene||talkOpen()){isWalking=false;if(cutscene&&animT<1)animT=Math.min(1,animT+dt*walkSpeed());return}
 if(FISH.active){if(Math.abs(joyVec.x)>0.25||Math.abs(joyVec.y)>0.25){FISH.active=false;showDialog("Du holst die Angel ein.")}isWalking=false;return}
 const speed=walkSpeed(); // Kacheln/Sekunde
 if(animT<1)animT=Math.min(1,animT+dt*speed);
 // Spielstand gedrosselt speichern statt bei jedem Schritt (verhindert Mikro-Ruckler)
 saveTimer+=dt;
 const mx=Math.abs(joyVec.x)>0.25?Math.sign(joyVec.x):0;
 const my=Math.abs(joyVec.y)>0.25?Math.sign(joyVec.y):0;
 const wasWalking=isWalking;
 isWalking=(mx!==0||my!==0);
 if(mx===0&&my===0){
  stepAcc=0;
  if(saveDirty&&animT>=1){save();saveDirty=false;saveTimer=0}
  return;
 }
 // Beim Loslaufen sofort reagieren, sobald die letzte Bewegung abgeschlossen ist
 if(!wasWalking&&animT>=1)stepAcc=1;
 else stepAcc+=dt*speed;
 if(stepAcc<1)return;
 stepAcc=Math.min(stepAcc-1,0.5);
 let nx=state.px,ny=state.py;
 if(Math.abs(joyVec.x)>Math.abs(joyVec.y)){nx+=mx;state.dir=mx>0?"right":"left"}
 else{ny+=my;state.dir=my>0?"down":"up"}
 if(!blocked(nx,ny)&&!wanderTrainerAt(nx,ny)){
  // Restfortschritt der vorherigen Animation übernehmen, damit das Gleiten nahtlos weiterläuft
  const rp=renderPos();
  animFromX=rp.x;animFromY=rp.y;animT=0;
  state.px=nx;state.py=ny;
  saveDirty=true;
  checkTile();
  eggStep();
  if(saveTimer>2){save();saveDirty=false;saveTimer=0}
 }else{
  const ob=obstacleAt(nx,ny);
  if(ob)onObstacleBump(ob,false);
 }
}

function makeTouchScrollable(el){
 let startY=0,startScroll=0,dragging=false;
 el.addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  dragging=true;startY=e.touches[0].clientY;startScroll=el.scrollTop;
 },{passive:true});
 el.addEventListener("touchmove",e=>{
  if(!dragging||e.touches.length!==1)return;
  const dy=e.touches[0].clientY-startY;
  el.scrollTop=startScroll-dy;
 },{passive:true});
 el.addEventListener("touchend",()=>{dragging=false});
 el.addEventListener("touchcancel",()=>{dragging=false});
}

function typeCycleSVG(){
 const cx=150,cy=150,R=114,n=TYPE_CYCLE.length,NR=25;
 const pts=TYPE_CYCLE.map((t,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return {t,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}});
 let arrows="",nodes="",star="";
 // Gestrichelte Linien durch die Mitte: jedes Element ist mit dem genau gegenüberliegenden verbunden (lernt dessen Attacken)
 pts.forEach((p,i)=>{
  if(i>=n/2)return;
  const q=pts[(i+n/2)%n];
  star+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="#ffdd88" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/>`;
 });
 arrows+=star;
 pts.forEach((p,i)=>{
  const q=pts[(i+1)%n],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d,r=NR+2;
  const x1=p.x+ux*r,y1=p.y+uy*r,x2=q.x-ux*(r+4),y2=q.y-uy*(r+4);
  arrows+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#7dff8a" stroke-width="3.5" marker-end="url(#arr)"/>`;
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  arrows+=`<text x="${mx-uy*12}" y="${my+ux*12+4}" font-size="11" font-weight="bold" fill="#7dff8a" text-anchor="middle">x2</text>`;
 });
 pts.forEach(p=>{
  nodes+=`<circle cx="${p.x}" cy="${p.y}" r="${NR}" fill="${TYPECOLORS[p.t]}" stroke="#fff" stroke-width="3"/>
  <text x="${p.x}" y="${p.y-1}" font-size="16" text-anchor="middle">${TYPE_ICONS[p.t]}</text>
  <text x="${p.x}" y="${p.y+14}" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle" style="paint-order:stroke" stroke="#000a" stroke-width="2.5">${p.t}</text>`;
 });
 return `<svg viewBox="0 0 300 300" width="100%" style="max-width:320px;display:block;margin:0 auto">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7dff8a"/></marker></defs>
  ${arrows}${nodes}</svg>`;
}

 sylvarion:{name:"Waldsegen",icon:"🌿",desc:"heilt am Ende jeder Runde 1/10 seiner max. KP",regen:0.1},

// Eine Aktion eines Monsters (inkl. Schlaf/Benommenheit/Verwirrung) – schreibt alles ins Dialogfenster
async function act(actor,target,moveKey,side){
 const other=side==="a"?"e":"a";
 const n=actor.name;
 if(actor.status==="schlaf"){
  if(actor.sleepTurns>0){actor.sleepTurns--;await say(`${n} schläft tief und fest … 💤`);return}
  actor.status=null;renderBattle();await say(`${n} ist aufgewacht!`);
 }
 if(actor.status==="benommen"&&Math.random()<0.25){await say(`${n} ist benommen und kann sich nicht bewegen! 💫`);return}
 if(actor.confused>0){
  actor.confused--;
  if(actor.confused===0){renderBattle();await say(`${n} ist nicht mehr verwirrt!`)}
  else{
   await say(`${n} ist verwirrt … ❓`);
   if(Math.random()<0.33){
    const d=Math.max(1,Math.min(Math.ceil(actor.maxhp*0.15),Math.floor(actor.atk*0.5*(0.85+Math.random()*0.3))));
    actor.hp=Math.max(0,actor.hp-d);
    flashHit(side);renderBattle();
    await say(`Es hat sich vor Verwirrung selbst verletzt!`);return;
   }
  }
 }
 const mv=MOVES[moveKey];
 attackAnim(side);sfx("attack");
 if(Math.random()>=mv.acc){renderBattle();await say(`${n} setzt ${mv.name} ein! Doch der Angriff geht daneben!`);return}
 if(mv.pow>0){
  const d=dmgCalc(actor,target,mv);
  target.hp=Math.max(0,target.hp-d);
  flashHit(other,eff(mv.type,target.type));renderBattle();
  await say(`${n} setzt ${mv.name} ein!${effText(mv.type,target.type)} (${d} Schaden)`);
  if(mv.drain&&actor.hp>0&&actor.hp<actor.maxhp){const h=Math.min(actor.maxhp-actor.hp,Math.max(1,Math.floor(d*mv.drain)));actor.hp+=h;renderBattle();await say(`✨ ${n} wird vom Licht gestärkt und heilt ${h} KP!`)}
  if(mv.defDown&&target.hp>0){if((target.defDown||0)<3){target.defDown=(target.defDown||0)+mv.defDown;renderBattle();await say(`🛡️ Die Verteidigung von ${target.name} sinkt!`)}else await say(`Die Verteidigung von ${target.name} kann nicht weiter sinken.`)}
  if(mv.effect&&target.hp>0&&Math.random()<mv.effect.chance){
   const m=applyStatus(target,mv.effect.status,false);
   if(m){renderBattle();await say(m)}
  }
 }else{
  renderBattle();
  await say(`${n} setzt ${mv.name} ein!`);
  const m=applyStatus(target,mv.effect.status,true);
  renderBattle();
  if(m)await say(m);
 }
}
// Rundenende: Gift und Verbrennung schaden (max. 9 KP)
async function roundEnd(){
 for(const [c,side] of [[battle.ally,"a"],[battle.enemy,"e"]]){
  if(!battle||battle.over)return;
  {const p=passiveOf(c);if(p&&p.regen&&c.hp>0&&c.hp<c.maxhp){const h=Math.min(c.maxhp-c.hp,Math.max(1,Math.floor(c.maxhp*p.regen)));c.hp+=h;renderBattle();await say(`${p.icon} ${p.name}: ${c.name} erholt sich um ${h} KP.`)}}
  if(c.hp>0&&(c.status==="gift"||c.status==="brand")){
   const d=Math.min(c.hp,statusDot(c));
   c.hp-=d;flashHit(side);renderBattle();
   await say(c.status==="gift"?`${c.name} leidet unter der Vergiftung! ☠️ (−${d} KP)`:`${c.name} leidet unter seiner Verbrennung! 🔥 (−${d} KP)`);
  }
 }
}
// Prüft besiegte Monster. true = Kampf ist vorbei
async function checkFaints(){
 if(!battle||battle.over)return true;
 const e=battle.enemy;
 if(e.hp<=0){
  await say(`${e.name} wurde besiegt!`);
  await passiveLeave(e);
  if(!battle.defeatedList)battle.defeatedList=[];
  markParticipant();
  battle.defeatedList.push({sid:e.sid,level:e.level,name:e.name,parts:[...battle.parts]});
  battle.parts=new Set([battle.ally]); // für das nächste Gegner-Monster neu zählen
  if(battle.arenaTeam&&battle.arenaIndex<battle.arenaTeam.length-1){
   battle.arenaIndex++;
   const next=battle.arenaTeam[battle.arenaIndex];
   battle.enemy=next.creature?Object.assign({},next.creature,{moves:next.creature.moves.slice()}):makeCreature(next.sid,next.level);
   clearBattleStatus(battle.enemy);
   renderBattle();
   await say(`${battle.arenaChampionName} schickt ${battle.enemy.name} ins Feld!`);
   await passiveEnter(battle.enemy);
  } else {
   await endBattle(true);return true;
  }
 }
 const a=battle.ally;
 if(a.hp<=0){
  a.confused=0;
  await say(`${a.name} kann nicht mehr kämpfen!`);
  await passiveLeave(a);
  const idx=activeIdx();
  if(idx<0){await endBattle(false);return true}
  battle.ally=state.team[idx];markParticipant();renderBattle();save();
  await say(`Los, ${battle.ally.name}!`);
  await passiveEnter(battle.ally);
 }
 return false;
}
// Eine ganze Runde. allyMove=null: Spieler hat seinen Zug schon anders genutzt (Wechsel, Item, Fangversuch)
async function runRound(allyMove){
 if(!battle||battle.over)return;
 battle.busy=true;hideBattleMenus();battle.log="";renderBattle();
 if(allyMove)markParticipant();
 const a=battle.ally,e=battle.enemy;
 const em=pickEnemyMove(e,a);
 const pa=passiveOf(a),pe=passiveOf(e);
 const aFirst=(pa&&pa.first&&!(pe&&pe.first))?true:(pe&&pe.first&&!(pa&&pa.first))?false:effSpd(a)>=effSpd(e);
 const order=allyMove?(aFirst?["a","e"]:["e","a"]):["e"];
 for(const who of order){
  if(!battle||battle.over)return;
  if(a.hp<=0||e.hp<=0)break;
  if(who==="a")await act(a,e,allyMove,"a");
  else await act(e,a,em,"e");
 }
 if(!battle||battle.over)return;
 if(a.hp>0&&e.hp>0)await roundEnd();
 if(await checkFaints())return;
 showMenu();
}

function dmgCalc(att,def,move){
 const stab=move.type===att.type?1.2:1;
 const fx=eff(move.type,def.type);
 const burn=att.status==="brand"?0.8:1; // Verbrennung schwächt Angriffe etwas
 const defDown=1+0.25*(def.defDown||0); // gesenkte Verteidigung: mehr Schaden
 const pA=passiveOf(att),pD=passiveOf(def);
 const pas=((pA&&pA.dmgMul)||1)*((pD&&pD.dmgTakenMul)||1)*amuletMul(att,"att")*amuletMul(def,"def");
 const raw=((att.atk*move.pow)/50)*stab*fx*burn*defDown*pas;
 return Math.max(1,Math.floor(raw*(0.85+Math.random()*0.3)));
}

function simpleBonusDue(c){const sp=SPECIES[c.sid];if(!sp||!sp.simple||c.level<20)return 0;return Math.floor((c.level-20)/2)+1}
function pointsForLevelUp(c){
 const sp=SPECIES[c.sid];
 if(sp.stage>=4&&c.level>=90)return 0;
 let p=3;
 if(sp.simple&&c.level>=20&&c.level%2===0){p++;c.simpleBonus=(c.simpleBonus||0)+1}
 return p;
}
function levelUpCreature(a){
 let leveled=false,learned=[],stored=[],evolved=null,pointsGained=0;
 if(!a.learned)a.learned=a.moves.slice();
 while(a.exp>=a.expNeed){
  a.exp-=a.expNeed;a.level++;a.maxhp+=4;a.hp=a.maxhp;a.atk+=2;a.def+=2;a.spd+=1;a.spec+=1;a.expNeed=a.level*20*(SPECIES[a.sid].slowExp?2:1);
  const gain=pointsForLevelUp(a);a.points=(a.points||0)+gain;pointsGained+=gain;leveled=true;
  const learnList=(LEARN[a.sid]&&LEARN[a.sid][a.level])||[];
  learnList.forEach(learn=>{
   if(a.learned.includes(learn))return;
   a.learned.push(learn);
   const label=`${MOVES[learn].name} (${MOVES[learn].type})`;
   if(a.moves.length<4){a.moves.push(learn);learned.push(label)}
   else{stored.push(label)}
  });
  while(SPECIES[a.sid].evo&&a.level>=evoLevelOf(a.sid))evolved=evolveCreature(a)||evolved;
  if(SPECIES[a.sid].evoChoice&&a.level>=evoLevelOf(a.sid))a.evoReady=true;
 }
 return {leveled,level:a.level,learned,stored,evolved,pointsGained};
}
function expGain(enemyLevel,recipientLevel){
 const base=enemyLevel*8;
 const ratio=Math.min(2,Math.max(0.1,enemyLevel/recipientLevel));
 return Math.max(1,Math.round(base*ratio));
}

  }

   tryMove(dt);

   draw();renderHUD()
  }
 }catch(err){
  showDebugError((err&&err.message)||String(err));

function isMove(x){return typeof x==="string"&&Object.prototype.hasOwnProperty.call(MOVES,x)}
function mpWish(w){return TYPE_CYCLE.includes(w)?w:"egal"}
const GREETINGS=["👋 Hallo!","⚔️ Lust auf einen Kampf?","🔄 Magst du tauschen?","🎉 Gut gemacht!","😄 Viel Spaß beim Spielen!"];
function mpEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function mpTrainer(s){return String(s||"Trainer").slice(0,16)}
function mpOnlineCount(){return MP.peers.filter(p=>!p.isMe&&p.kind==="viewer").length}
function mpMyPeer(){const me=MP.peers.find(p=>p.sameTab);return me?me.peer:null}
function mpPack(c){return {sid:c.sid,level:c.level,exp:c.exp||0,maxhp:c.maxhp,atk:c.atk,def:c.def,spd:c.spd,spec:c.spec,moves:c.moves.slice(0,4),learned:(c.learned||c.moves).slice(0,40)}}
// Daten anderer Spieler sind nicht vertrauenswürdig: alles prüfen und begrenzen
function mpCleanCreature(o){
 if(!o||typeof o!=="object"||!isSid(o.sid))return null;
 const lvl=Math.max(1,Math.min(100,Math.floor(+o.level)||1));
 const c=makeCreature(o.sid,lvl);
 const num=(v,d)=>{v=Math.floor(+v);return isFinite(v)&&v>0&&v<=3000?v:d};
 c.maxhp=num(o.maxhp,c.maxhp);c.hp=c.maxhp;c.atk=num(o.atk,c.atk);c.def=num(o.def,c.def);c.spd=num(o.spd,c.spd);c.spec=num(o.spec,c.spec);
 if(Array.isArray(o.moves)){const mv=o.moves.filter(m=>isMove(m)).slice(0,4);if(mv.length)c.moves=mv}
 const ln=Array.isArray(o.learned)?o.learned.filter(m=>isMove(m)).slice(0,40):[];
 c.learned=Array.from(new Set(c.learned.concat(ln,c.moves)));
 c.expNeed=c.level*20*(SPECIES[c.sid].slowExp?2:1);c.exp=Math.max(0,Math.min(c.expNeed-1,Math.floor(+o.exp)||0));c.points=0;
 ensureCreatureFields(c);
 return c;
}
function mpAddCreature(c){if(state.team.length<6)state.team.push(c);else state.storage.push(c)}
function mpMyCreatures(){return state.team.map((c,i)=>({c,where:"team",i})).concat(state.storage.map((c,i)=>({c,where:"storage",i})))}
function mpRemoveCreature(c){for(const arr of [state.team,state.storage]){const i=arr.indexOf(c);if(i>=0){arr.splice(i,1);return true}}return false}

function mpInit(){
 if(MP.started)return;MP.started=true;
 if(!window.claude||typeof window.claude.use!=="function")return;
 Promise.all(["db","room","user"].map(n=>Promise.resolve(window.claude.use(n)).catch(()=>null))).then(async([db,room,user])=>{
  MP.db=db;MP.room=room;MP.user=user;
  if(user){
   try{MP.uid=await user.id()}catch(e){}
   try{if((await user.can("data.write"))===false)MP.canWrite=false}catch(e){}
  }
  if(db){
   try{db.collection("players").limit(300).onSnapshot(s=>{MP.players=s.docs.map(d=>d.data()).filter(p=>p&&typeof p==="object");mpResolveNames();mpRefresh()},()=>{})}catch(e){}
   try{db.collection("trades").limit(300).onSnapshot(s=>{MP.trades=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));mpCheckMyTrades();mpRefresh()},()=>{})}catch(e){}
  }
  if(room){
   try{room.onPeers(ch=>{MP.peers=ch.peers.slice();mpResolveNames();mpRefresh()},()=>{})}catch(e){}
   try{room.on("greet",mpOnGreet,()=>{})}catch(e){}
  }
  MP.ready=!!(db||room);
  mpSetPresence();mpSync();mpRefresh();
 });
}
// Echte Namen (so wie dieser Betrachter sie sieht) zusätzlich zum Trainernamen – nie gespeichert
function mpResolveNames(){
 if(!MP.user)return;
 const ids=new Set();
 MP.players.forEach(p=>{if(typeof p.uid==="string")ids.add(p.uid)});
 MP.peers.forEach(p=>{if(p.by)ids.add(p.by)});
 MP.trades.forEach(t=>{if(typeof t.from==="string")ids.add(t.from)});
 const list=[...ids].filter(id=>!(id in MP.names));
 if(!list.length)return;
 list.forEach(id=>MP.names[id]="");
 MP.user.profiles(list).then(ps=>{let ch=false;list.forEach(id=>{const n=(ps[id]&&ps[id].name)||"";if(n){MP.names[id]=n;ch=true}});if(ch)mpRefresh()}).catch(()=>{});
}
function mpWho(uid,trainer){
 const real=uid&&MP.names[uid];
 return `<b>${mpEsc(mpTrainer(trainer))}</b>${real?` <span style="opacity:.7;font-size:12px">(${mpEsc(real)})</span>`:""}`;
}
function mpSetPresence(){
 if(!MP.room)return;
 const c=state.team[0];
 const p={trainer:mpTrainer(state.playerName),lead:c?c.sid:"",lvl:c?c.level:0,uid:MP.uid||null};
 const k=JSON.stringify(p);if(k===MP.lastPresence)return;MP.lastPresence=k;
 MP.room.presence(p).catch(()=>{});
}
function mpSummary(){
 const all=state.team.concat(state.storage);
 return {uid:MP.uid,trainer:mpTrainer(state.playerName),dex:new Set(all.map(c=>c.sid)).size,monsters:all.length,
  maxLevel:all.reduce((m,c)=>Math.max(m,c.level),0),arena:!!state.arenaBeaten,medals:medalCount(),wins:state.pvpWins||0,losses:state.pvpLosses||0,
  team:state.team.slice(0,6).map(mpPack)};
}
function mpScheduleSync(){if(!MP.ready)return;clearTimeout(MP.syncTimer);MP.syncTimer=setTimeout(mpSync,3000)}
async function mpSync(){
 mpSetPresence();
 if(!MP.db||!MP.uid||!MP.canWrite||!state.team.length)return;
 const sum=mpSummary(),key=JSON.stringify(sum);
 if(key===MP.lastSync)return;
 if(MP.syncing){MP.syncPending=true;return}
 MP.syncing=true;
 try{await MP.db.doc("players/"+MP.uid).set(Object.assign({},sum,{updatedAt:Date.now()}));MP.lastSync=key}
 catch(e){if(e&&e.code==="invalid_argument")MP.canWrite=false}
 MP.syncing=false;
 if(MP.syncPending){MP.syncPending=false;mpScheduleSync()}
}
function mpOnGreet(msg){
 if(msg.isMe)return;
 const d=(msg.data&&typeof msg.data==="object")?msg.data:{};
 if(d.to&&d.to!==mpMyPeer())return;
 const g=GREETINGS[Math.floor(+d.g)];if(!g)return;
 const peer=MP.peers.find(p=>p.peer===msg.peer);
 const who=mpTrainer(peer&&peer.presence&&peer.presence.trainer||"Jemand");
 showDialog(`💬 ${who}: ${g}`);
}
function mpGreet(to,g){
 if(!MP.room)return;
 MP.room.emit("greet",{to:to||null,g}).then(()=>showDialog("💬 Gruß gesendet: "+GREETINGS[g]))
  .catch(e=>showDialog(e&&e.code==="not_permitted"?"Grüßen ist für dich hier nicht freigeschaltet.":"Der Gruß konnte gerade nicht gesendet werden."));
}
// Abgeschlossene Tausche, bei denen ich der Anbieter war: Monster abholen und Angebot entfernen
function mpCheckMyTrades(){
 if(!MP.uid||!MP.db)return;
 if(!Array.isArray(state.tradesDone))state.tradesDone=[];
 let changed=false;
 MP.trades.forEach(t=>{
  if(t.from!==MP.uid||t.status!=="taken")return;
  if(!state.tradesDone.includes(t.id)){
   const got=mpCleanCreature(t.give);
   state.tradesDone.push(t.id);state.tradesDone=state.tradesDone.slice(-60);
   if(got){
    mpAddCreature(got);changed=true;
    const offName=t.offer&&isSid(t.offer.sid)?SPECIES[t.offer.sid].name:"Monster";
    showDialog(`🔄 Tausch abgeschlossen! ${mpTrainer(t.takerTrainer)} hat dein ${offName} genommen – du bekommst ${got.name} Lv.${got.level}.`);
   }
  }
  MP.db.doc("trades/"+t.id).delete().catch(()=>{});
 });
 if(changed)save();
}
async function mpLease(ref){
 try{const r=await ref.acquire({holder:MP.uid,ttlMs:8000});return !!(r&&r.acquired)}catch(e){return false}
}
async function mpPostTrade(c,wish){
 if(MP.busy)return;
 const mine=MP.trades.filter(t=>t.from===MP.uid&&t.status==="open").length;
 if(mine>=3){showDialog("Du hast schon 3 offene Angebote. Zieh eins zurück, bevor du ein neues erstellst.");return}
 if(state.team.includes(c)&&state.team.length<=1){showDialog("Du brauchst mindestens ein Monster im Team.");return}
 MP.busy=true;
 mpRemoveCreature(c);save();
 try{
  await MP.db.collection("trades").add({from:MP.uid,fromTrainer:mpTrainer(state.playerName),offer:mpPack(c),wish,status:"open",createdAt:Date.now()});
  showDialog(`🔄 ${c.name} steht jetzt in der Tauschbörse. Du bekommst Bescheid, sobald jemand tauscht.`);
  MP.flow=null;
 }catch(e){
  mpAddCreature(c);save();
  showDialog(e&&e.code==="quota_exceeded"?"Die Tauschbörse ist gerade voll.":"Das Angebot konnte nicht erstellt werden.");
 }
 MP.busy=false;renderMulti();
}
async function mpTakeTrade(tid,c){
 if(MP.busy)return;
 const t=MP.trades.find(x=>x.id===tid);if(!t)return;
 const got=mpCleanCreature(t.offer);
 if(!got){showDialog("Dieses Angebot ist fehlerhaft.");return}
 MP.busy=true;
 const ref=MP.db.doc("trades/"+tid);
 try{
  if(!(await mpLease(ref))){showDialog("Jemand anderes tauscht gerade – versuch es gleich nochmal.");MP.busy=false;return}
  const snap=await ref.get(),d=snap.exists?snap.data():null;
  if(!d||d.status!=="open"){showDialog("Dieses Angebot ist leider nicht mehr verfügbar.");MP.busy=false;MP.flow=null;renderMulti();return}
  await ref.update({status:"taken",taker:MP.uid,takerTrainer:mpTrainer(state.playerName),give:mpPack(c),takenAt:Date.now()});
  mpRemoveCreature(c);mpAddCreature(got);
  if(!state.team.length&&state.storage.length)state.team.push(state.storage.shift());
  save();
  showDialog(`🔄 Tausch geklappt! Du gibst ${c.name} und bekommst ${got.name} Lv.${got.level}.`);
  MP.flow=null;
 }catch(e){showDialog("Der Tausch hat nicht geklappt. Versuch es nochmal.")}
 MP.busy=false;renderMulti();
}
async function mpCancelTrade(tid){
 if(MP.busy)return;
 const t=MP.trades.find(x=>x.id===tid);if(!t||t.from!==MP.uid)return;
 MP.busy=true;
 const ref=MP.db.doc("trades/"+tid);
 try{
  if(!(await mpLease(ref))){showDialog("Das Angebot wird gerade getauscht – einen Moment.");MP.busy=false;return}
  const snap=await ref.get(),d=snap.exists?snap.data():null;
  if(d&&d.status==="open"){
   await ref.delete();
   const back=mpCleanCreature(d.offer);if(back){mpAddCreature(back);save()}
   showDialog(back?`${back.name} ist zurück bei dir.`:"Angebot zurückgezogen.");
  }
 }catch(e){showDialog("Das Angebot konnte nicht zurückgezogen werden.")}
 MP.busy=false;renderMulti();
}
function mpChallenge(uid){
 const p=MP.players.find(x=>x.uid===uid);
 if(!p||!Array.isArray(p.team))return;
 const team=p.team.slice(0,6).map(mpCleanCreature).filter(Boolean);
 if(!team.length){showDialog("Dieses Team kann gerade nicht antreten.");return}
 const idx=activeIdx();
 if(idx<0){showDialog("Deine Monster sind erschöpft – heile sie zuerst.");return}
 subpanel.style.display="none";menu.style.display="none";MP.flow=null;
 const trainer=mpTrainer(p.trainer);
 battle={enemy:Object.assign({},team[0],{moves:team[0].moves.slice()}),ally:state.team[idx],
  log:`Das Team von ${trainer} tritt an! ${team[0].name} kommt heraus!`,trainer:true,
  arenaTeam:team.map(c=>({creature:c,sid:c.sid,level:c.level})),arenaIndex:0,arenaChampionName:trainer,pvp:{uid,trainer}};
 openBattlePanel();
}

// ---------- Mehrspieler-Bildschirm ----------
function mpCard(sid,title,sub,right){
 return `<div class="subCard"><div class="miniSprite" style="width:44px;height:44px;flex:0 0 auto">${isSid(sid)?creatureSVG(sid):""}</div>
  <div style="flex:1;min-width:0">${title}<div style="font-size:12px;opacity:.85">${sub||""}</div></div>${right||""}</div>`;
}
function mpTabHtml(){
 const others=MP.players.filter(p=>p.uid!==MP.uid);
 if(MP.flow&&MP.flow.kind==="greet"){
  return `<h4>💬 Gruß an ${mpEsc(MP.flow.label)}</h4>`+GREETINGS.map((g,i)=>`<button data-greet="${i}" style="width:100%;margin:4px 0">${g}</button>`).join("")+
   `<button data-mpback="1" style="width:100%;margin-top:8px">◀ Zurück</button>`;
 }
 if(MP.flow&&MP.flow.kind==="post"){
  const f=MP.flow;
  const wishes=["egal"].concat(TYPE_CYCLE);
  return `<h4>🔄 Neues Tauschangebot</h4><div style="font-size:12.5px;opacity:.85;margin-bottom:6px">1. Welches Monster bietest du an?</div>`+
   mpMyCreatures().map((m,i)=>mpCard(m.c.sid,`<b>${mpEsc(m.c.name)}</b> Lv.${m.c.level}`,`${m.c.type} · ${m.where==="team"?"Team":"Lager"}`,
    `<button data-postsel="${i}" style="flex:0 0 auto"${f.sel===i?' class="on"':""}>${f.sel===i?"✔ Gewählt":"Wählen"}</button>`)).join("")+
   `<div style="font-size:12.5px;opacity:.85;margin:8px 0 4px">2. Was möchtest du dafür?</div><div class="optSeg" style="flex-wrap:wrap">`+
   wishes.map(w=>`<button data-wish="${w}" class="${f.wish===w?"on":""}" style="flex:1 0 22%">${w==="egal"?"Beliebig":(TYPE_ICONS[w]||"")+" "+w}</button>`).join("")+`</div>`+
   `<button data-postgo="1" style="width:100%;margin-top:10px"${f.sel==null||MP.busy?" disabled":""}>Angebot einstellen</button>`+
   `<button data-mpback="1" style="width:100%;margin-top:6px">◀ Zurück</button>`;
 }
 if(MP.flow&&MP.flow.kind==="take"){
  const t=MP.trades.find(x=>x.id===MP.flow.tid);
  if(!t||t.status!=="open"){MP.flow=null;return mpTabHtml()}
  const off=t.offer||{},wish=mpWish(t.wish);
  const cands=mpMyCreatures().filter(m=>wish==="egal"||m.c.type===wish);
  return `<h4>🔄 Tauschen mit ${mpEsc(mpTrainer(t.fromTrainer))}</h4>`+
   mpCard(off.sid,`Du bekommst: <b>${mpEsc(isSid(off.sid)?SPECIES[off.sid].name:"?")}</b> Lv.${Math.floor(+off.level)||"?"}`,isSid(off.sid)?SPECIES[off.sid].type:"")+
   `<div style="font-size:12.5px;opacity:.85;margin:8px 0 4px">Was gibst du dafür? ${wish==="egal"?"(beliebiges Monster)":`(gewünscht: ${mpEsc(wish)})`}</div>`+
   (cands.length?cands.map(m=>{const i=mpMyCreatures().findIndex(x=>x.c===m.c);return mpCard(m.c.sid,`<b>${mpEsc(m.c.name)}</b> Lv.${m.c.level}`,`${m.c.type} · ${m.where==="team"?"Team":"Lager"}`,
     `<button data-give="${i}" style="flex:0 0 auto"${MP.busy?" disabled":""}>Geben</button>`)}).join("")
    :`<div style="opacity:.75;text-align:center;padding:8px">Du hast kein passendes Monster.</div>`)+
   `<button data-mpback="1" style="width:100%;margin-top:8px">◀ Zurück</button>`;
 }
 if(MP.tab==="online"){
  const peers=MP.peers.filter(p=>!p.isMe&&p.kind==="viewer");
  let h=`<div style="font-size:12.5px;opacity:.85;margin-bottom:6px">Wer das Spiel gerade geöffnet hat. Du kannst Grüße schicken oder das Team herausfordern.</div>`;
  if(!MP.room)h+=`<div style="opacity:.75;text-align:center;padding:8px">Die Online-Anzeige ist hier gerade nicht verfügbar.</div>`;
  else if(!peers.length)h+=`<div style="opacity:.75;text-align:center;padding:12px">Gerade ist niemand sonst online.<br><small>Teile das Spiel mit Freunden, dann seht ihr euch hier.</small></div>`;
  else{
   h+=peers.map(p=>{
    const pr=p.presence||{},uid=typeof pr.uid==="string"?pr.uid:p.by;
    const hasTeam=MP.players.some(x=>x.uid===uid&&uid!==MP.uid&&Array.isArray(x.team)&&x.team.length);
    return mpCard(typeof pr.lead==="string"?pr.lead:"",mpWho(p.by||uid,pr.trainer)+(p.guest?' <span style="font-size:11px;opacity:.7">Gast</span>':""),
     pr.lead&&isSid(pr.lead)?`${SPECIES[pr.lead].name} Lv.${Math.floor(+pr.lvl)||"?"}`:"",
     `<div style="display:flex;flex-direction:column;gap:4px;flex:0 0 auto"><button data-greetto="${mpEsc(p.peer)}" data-label="${mpEsc(mpTrainer(pr.trainer))}">💬 Grüßen</button>${hasTeam?`<button data-challenge="${mpEsc(uid)}">⚔️ Kampf</button>`:""}</div>`);
   }).join("");
   h+=`<button data-greetto="" data-label="alle" style="width:100%;margin-top:6px">💬 Alle grüßen</button>`;

 if(MP.tab==="rank"){

    return `<div class="subCard" style="${me?"outline:2px solid #ffe37a;":""}"><div style="width:30px;text-align:center;font-weight:bold">${medal}</div>
     <div class="miniSprite" style="width:36px;height:36px;flex:0 0 auto">${isSid(lead)?creatureSVG(lead):""}</div>
     <div style="flex:1;min-width:0">${mpWho(p.uid,p.trainer)}${me?" (du)":""}${Math.floor(+p.medals)?` 🏅${Math.floor(+p.medals)}`:(p.arena?" 🏆":"")}<div style="font-size:12px;opacity:.8">${Math.floor(+p.monsters)||0} Monster · ${Math.floor(+p.wins)||0} Siege / ${Math.floor(+p.losses)||0} Niederlagen</div></div>
     <div style="font-weight:bold;font-size:16px;white-space:nowrap">${MP.rankBy==="maxLevel"?unit+" "+v:v+" "+unit}</div></div>`;
   }).join(""):`<div style="opacity:.75;text-align:center;padding:12px">Noch keine Einträge.</div>`)+

 }
 if(MP.tab==="battle"){

 }
 return "";
}
function renderMulti(){
 const st=subContent.scrollTop;
 const tabs=[["online","🟢 Online"],["rank","🏆 Rangliste"],["battle","⚔️ Kämpfe"],["trade","🔄 Tausch"]];
 let body;
 if(!MP.ready)body=`<div class="subCard" style="display:block">🌐 Mehrspieler ist hier gerade nicht verfügbar.<br><small style="opacity:.8">Er funktioniert im veröffentlichten Spiel auf claude.ai, wenn du angemeldet bist und das Spiel mit dir geteilt wurde.</small></div>`;
 else body=mpTabHtml();
 const online=mpOnlineCount();
 openSub(`<div id="mpRoot"><h3>🌐 Mehrspieler${online?` <span style="font-size:13px;color:#7dff8a">· ${online} online</span>`:""}</h3>
  ${MP.flow?"":`<div class="optSeg" style="margin-bottom:10px">${tabs.map(([k,l])=>`<button data-mptab="${k}" class="${MP.tab===k?"on":""}">${l}</button>`).join("")}</div>`}
  ${body}</div>`);
 subContent.scrollTop=MP.keepScroll?st:0;MP.keepScroll=false;
 subContent.onclick=mpClick;
}
function mpRefresh(){
 const root=document.getElementById("mpRoot");
 if(root&&subpanel.style.display==="flex"&&!MP.busy){MP.keepScroll=true;renderMulti()}
}
function mpClick(e){
 const b=e.target.closest("button");if(!b||b.disabled)return;
 const d=b.dataset;
 if(d.mptab){MP.tab=d.mptab;MP.flow=null;renderMulti();return}
 if(d.mpback){MP.flow=null;renderMulti();return}
 if(d.rank){MP.rankBy=d.rank;renderMulti();return}
 if(d.greetto!==undefined){MP.flow={kind:"greet",to:d.greetto||null,label:d.label||"alle"};renderMulti();return}
 if(d.greet!==undefined){const f=MP.flow;MP.flow=null;mpGreet(f&&f.to,+d.greet);renderMulti();return}
 if(d.challenge){mpChallenge(d.challenge);return}
 if(d.newtrade){MP.flow={kind:"post",sel:null,wish:"egal"};renderMulti();return}
 if(d.postsel!==undefined){MP.flow.sel=+d.postsel;MP.keepScroll=true;renderMulti();return}
 if(d.wish){MP.flow.wish=d.wish;MP.keepScroll=true;renderMulti();return}
 if(d.postgo){const m=mpMyCreatures()[MP.flow.sel];if(m)mpPostTrade(m.c,MP.flow.wish);return}
 if(d.take){MP.flow={kind:"take",tid:d.take};renderMulti();return}
 if(d.give!==undefined){const m=mpMyCreatures()[+d.give];if(m&&MP.flow)mpTakeTrade(MP.flow.tid,m.c);return}
 if(d.cancel){mpCancelTrade(d.cancel);return}
}
document.getElementById("mMulti").addEventListener("click",()=>{MP.flow=null;renderMulti()});

// ---------- OPTIONEN ----------
const OPT_DEFS=[
 {key:"text",label:"💬 Textgeschwindigkeit",choices:[["slow","Langsam"],["normal","Normal"],["fast","Schnell"]]},
 {key:"walk",label:"🏃 Laufgeschwindigkeit",choices:[["normal","Normal"],["fast","Schnell"]]},
 {key:"controls",label:"🎮 Steuerung",choices:[["std","Joystick links"],["swap","Joystick rechts"]]},
 {key:"gfx",label:"🎨 Monster-Grafik",choices:[["pixel","Pixel-Sprites"],["vector","Glatt (Vektor)"]]},
 {key:"sound",label:"🔊 Sound",choices:[["all","Musik + Effekte"],["sfx","Nur Effekte"],["off","Aus"]]}
];
function renderOptions(container,onBack,inGame){
 container.innerHTML=`<h3>⚙️ Optionen</h3>`+OPT_DEFS.map(d=>`<div class="optRow"><div class="optLabel">${d.label}</div><div class="optSeg">`+
   d.choices.map(([v,l])=>`<button data-opt="${d.key}" data-val="${v}" class="${OPTS[d.key]===v?"on":""}">${l}</button>`).join("")+`</div></div>`).join("")+
  `<div class="optRow"><div class="optLabel">🗑️ Spielstand</div><button id="optDelete" style="width:100%"${hasSave()||inGame?"":" disabled"}>Spielstand löschen</button></div>`+
  `<button id="optBack" style="width:100%;margin-top:10px">◀ Zurück</button>`;
 container.onclick=e=>{
  const b=e.target.closest("button[data-opt]");
  if(b){OPTS[b.dataset.opt]=b.dataset.val;saveOpts();applyOpts();renderOptions(container,onBack,inGame);return}
  if(e.target.closest("#optBack")){container.onclick=null;onBack();return}
  const del=e.target.closest("#optDelete");
  if(del){
   if(del.dataset.confirm){try{localStorage.removeItem("monsterwelt_save")}catch(err){}location.reload();return}
   del.dataset.confirm="1";del.textContent="Wirklich löschen? Nochmal tippen zum Bestätigen";del.style.background="#a8322a";
  }
 };
}
document.getElementById("mOpts").addEventListener("click",()=>{
 openSub("");renderOptions(subContent,()=>{subpanel.style.display="none"},true);
});
document.getElementById("mTitle").addEventListener("click",()=>{save();location.reload()});

// ---------- LADE- & TITELBILDSCHIRM ----------
function hasSave(){try{return !!localStorage.getItem("monsterwelt_save")}catch(e){return false}}
function saveSummary(){
 try{
  const s=JSON.parse(localStorage.getItem("monsterwelt_save"));
  const c=s.team&&s.team[0];
  const nm=c?((SPECIES[c.sid]&&SPECIES[c.sid].name)||c.name):"";
  return `${s.playerName||"Trainer"} · ${nm} Lv.${c?c.level:"?"} · Team ${s.team.length}/6`;
 }catch(e){return ""}
}
function showTitle(){
 setMusic("world");
 const el=document.createElement("div");el.id="title";
 let stars="";for(let i=0;i<28;i++)stars+=`<div class="tStar" style="left:${Math.random()*100}%;top:${Math.random()*55}%;animation-delay:${(Math.random()*2.4).toFixed(2)}s"></div>`;
 el.innerHTML=stars+`<div id="titleInner"><div id="titleLogo">MONSTERWELT</div><div id="titleSub">Das große Monster-Abenteuer</div>
  <div id="titleMons">${STARTER_SIDS.map((sid,i)=>`<div style="animation-delay:${i*0.18}s">${creatureSVG(sid)}</div>`).join("")}</div>
  <div id="titleLoad">Lade Monsterwelt …<div id="titleBar"><div></div></div></div>
  <div id="titleMenu"></div><div id="titlePanel"></div></div><div id="titleVer">v1.1 · by Franks</div>`;
 document.body.appendChild(el);makeTouchScrollable(el);
 const bar=el.querySelector("#titleBar div"),loadBox=el.querySelector("#titleLoad"),menuEl=el.querySelector("#titleMenu"),panel=el.querySelector("#titlePanel"),mons=el.querySelector("#titleMons");
 // Ladebalken: Monster-Grafiken vorbereiten (füllt den Grafik-Speicher), mindestens ~1,2 s anzeigen
 const t0=performance.now();let prog=0,ready=false;
 prepareSprites(p=>{prog=p}).then(()=>{ready=true;mons.innerHTML=STARTER_SIDS.map((sid,i)=>`<div style="animation-delay:${i*0.18}s">${creatureSVG(sid)}</div>`).join("")});
 (function step(){
  const pct=Math.min(prog,(performance.now()-t0)/1200);
  bar.style.width=(pct*100).toFixed(0)+"%";
  if(!(ready&&pct>=1))requestAnimationFrame(step);else setTimeout(showMenu,150);
 })();
 function close(then){el.style.transition="opacity .4s";el.style.opacity="0";setTimeout(()=>{el.remove();then()},400)}
 function showMenu(){
  loadBox.style.display="none";panel.style.display="none";mons.style.display="";
  const saved=hasSave();
  menuEl.innerHTML=`<button id="tCont"${saved?"":" disabled"}>▶ Spiel fortsetzen<small>${saved?saveSummary():"Kein Spielstand vorhanden"}</small></button>
   <button id="tNew">✨ Neues Spiel</button>
   <button id="tOpts">⚙️ Optionen</button>`;
  menuEl.style.display="flex";
  menuEl.onclick=e=>{
   if(e.target.closest("#tCont")&&saved){close(()=>{try{load();applyOpts();renderHUD()}catch(err){showDebugError("Laden: "+err.message)}startGame()});return}
   if(e.target.closest("#tNew")){saved?confirmNew():close(beginNewGame);return}
   if(e.target.closest("#tOpts")){menuEl.style.display="none";mons.style.display="none";panel.style.display="block";renderOptions(panel,showMenu,false);el.scrollTop=0}
  };
 }
 function confirmNew(){
  el.scrollTop=0;menuEl.style.display="none";mons.style.display="none";panel.style.display="block";
  panel.innerHTML=`<h3>✨ Neues Spiel</h3><div style="text-align:center;font-size:14px;margin-bottom:12px">Dein bisheriger Spielstand<br><b>${saveSummary()}</b><br>wird dabei überschrieben.</div>
   <button id="tYes" style="width:100%;background:#a8322a;margin-bottom:8px">Ja, neu beginnen</button><button id="tNo" style="width:100%">◀ Zurück</button>`;
  panel.onclick=e=>{
   if(e.target.closest("#tYes")){panel.onclick=null;try{localStorage.removeItem("monsterwelt_save")}catch(err){}close(beginNewGame)}
   if(e.target.closest("#tNo")){panel.onclick=null;showMenu()}
  };
 }
}
try{
 applyOpts();
 showTitle();
}catch(err){
 showDebugError("Start: "+((err&&err.message)||String(err)));
 if(load())startGame();else beginNewGame();
}
</script>
</body>
</html>
